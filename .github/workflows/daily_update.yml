name: Daily Data Update

# 10:15 UTC = 17:15 Vietnam time, after the HOSE close.
# World markets are covered by the same run using the previous US/EU close.
on:
  schedule:
    - cron: '15 10 * * *'
  workflow_dispatch:
    inputs:
      skip_world:
        description: 'Skip Yahoo Finance (Vietnam only)'
        type: boolean
        default: false
      skip_mutual_funds:
        description: 'Skip fmarket open-ended funds'
        type: boolean
        default: false

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update_data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run test suite
        run: python -m pytest tests -q

      - name: Update market data (Vietnam + world + FX)
        env:
          SKIP_WORLD: ${{ inputs.skip_world && '1' || '0' }}
          SKIP_MUTUAL_FUNDS: ${{ inputs.skip_mutual_funds && '1' || '0' }}
        run: python update_data.py

      - name: Data summary
        run: |
          python -c "
          import json, pathlib
          p = pathlib.Path('data/status.json')
          s = json.loads(p.read_text()) if p.exists() else {}
          print('instruments:', s.get('instruments'))
          print('range:', s.get('first_date'), '->', s.get('last_date'))
          print('by region:', s.get('by_region'))
          print('failures:', len(s.get('failed', [])))
          [print('warning:', w) for w in s.get('warnings', [])]
          "

      - name: Render the report in all three languages
        run: |
          mkdir -p docs
          for lang in VI EN DE; do
            python report.py --lang "$lang" --period 3Y --currency USD \
              --out "docs/report_${lang}.md"
          done

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data funds_data.csv funds_volume.csv funds_profile.csv docs
          git commit -m "Auto-update: global market data $(date -u +%Y-%m-%d)" \
            || { echo "No changes to commit"; exit 0; }
          for i in 1 2 3 4; do
            git push && break
            echo "push failed, retrying..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((2 ** i))
          done
