name: Daily Data Update

# Two runs a day, so every market is captured on its own trading day:
#   10:15 UTC = 17:15 Vietnam, after the HOSE close
#   22:30 UTC = after the US close, and therefore after Europe and Asia too
# The evening run is what makes the world data same-day instead of a day behind.
on:
  schedule:
    - cron: '15 10 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      skip_world:
        description: 'Skip Yahoo Finance (Vietnam only)'
        type: boolean
        default: false
      skip_mutual_funds:
        description: 'Skip fmarket open-ended funds'
        type: boolean
        default: false
      skip_etf_discovery:
        description: 'Skip US ETF discovery (curated universe only)'
        type: boolean
        default: false

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update_data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run test suite
        run: python -m pytest tests -q

      - name: Update market data (Vietnam + world + FX)
        env:
          SKIP_WORLD: ${{ inputs.skip_world && '1' || '0' }}
          SKIP_MUTUAL_FUNDS: ${{ inputs.skip_mutual_funds && '1' || '0' }}
          SKIP_ETF_DISCOVERY: ${{ inputs.skip_etf_discovery && '1' || '0' }}
        run: |
          for attempt in 1 2 3; do
            echo "::group::update attempt $attempt"
            python update_data.py && { echo "::endgroup::"; exit 0; }
            echo "::endgroup::"
            echo "attempt $attempt failed, retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          echo "::error::update_data.py failed three times"
          exit 1

      - name: Verify the dataset is fresh
        run: |
          python - <<'PY'
          import json, pathlib, sys
          from datetime import date, datetime
          status = json.loads(pathlib.Path("data/status.json").read_text())
          last = datetime.strptime(status["last_date"], "%Y-%m-%d").date()
          age = (date.today() - last).days
          print(f"last date {last} ({age} days old), "
                f"{status['instruments']} instruments, "
                f"{len(status.get('failed', []))} failures")
          # markets close on weekends and holidays, so allow a few days of slack
          if age > 5:
              print(f"::error::dataset is {age} days old")
              sys.exit(1)
          if status["instruments"] < 100:
              print(f"::error::only {status['instruments']} instruments")
              sys.exit(1)
          PY

      - name: Data summary
        run: |
          python -c "
          import json, pathlib
          p = pathlib.Path('data/status.json')
          s = json.loads(p.read_text()) if p.exists() else {}
          print('instruments:', s.get('instruments'))
          print('range:', s.get('first_date'), '->', s.get('last_date'))
          print('by region:', s.get('by_region'))
          print('US ETFs:', s.get('us_etfs_tracked'), 'tracked of', s.get('us_etfs_listed'), 'listed')
          print('failures:', len(s.get('failed', [])))
          [print('warning:', w) for w in s.get('warnings', [])]
          "

      - name: Render the report in all three languages
        run: |
          mkdir -p docs
          for lang in VI EN DE; do
            python report.py --lang "$lang" --period 3Y --currency USD \
              --out "docs/report_${lang}.md"
          done

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data funds_data.csv funds_volume.csv funds_profile.csv docs
          git commit -m "Auto-update: global market data $(date -u +%Y-%m-%d)" \
            || { echo "No changes to commit"; exit 0; }
          for i in 1 2 3 4; do
            git push && break
            echo "push failed, retrying..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((2 ** i))
          done
